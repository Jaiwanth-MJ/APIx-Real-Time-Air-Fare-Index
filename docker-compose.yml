version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: apix_timescaledb
    environment:
      POSTGRES_DB: apix
      POSTGRES_USER: apix_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apix_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/schema_pg.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - apix_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apix_user -d apix"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apix_redis
    ports:
      - "6379:6379"
    networks:
      - apix_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: apix_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - apix_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: apix_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - apix_network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: apix_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://apix_user:${POSTGRES_PASSWORD:-apix_secure_pass_2026}@db:5432/apix
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP: kafka:9092
    networks:
      - apix_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apix_frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - apix_network

volumes:
  timescale_data:

networks:
  apix_network:
    driver: bridge
